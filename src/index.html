<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ComputerCraft : Blockly Editor</title>
    <link rel="icon" href="favicon.ico">
  </head>
  <body>
    <div id="pageContainer">
      <div id="outputPane">
        <pre id="generatedCode" style="min-height: 50%;" class="language-lua"><code></code></pre>
        <div id="langBar" style="margin-top: 1em;">
          <label data-i18n="ui.lang">Мова:</label>
          <select id="langSelect">
            <option value="uk">Українська</option>
            <option value="en">English</option>
          </select>
        </div>
        <input type="text" name="fileName" id="fileName" value="program" style="margin-top: 1em;">
        <div style="margin-top: 0.5em;">
          <button id="copyButton" data-i18n="ui.copy">Копіювати</button>
          <button id="downloadButton" data-i18n="ui.download">Завантажити</button>
          <button id="downloadLuaButton" data-i18n="ui.downloadLua">Завантажити Lua</button>
          <button id="loadButton" data-i18n="ui.load">Відкрити</button>
        </div>
        <div id="mcUploadBar" style="margin-top: 1em; padding: 0.6em; border: 1px solid #444; border-radius: 6px;">
          <div style="margin-bottom: 0.5em;">
            <label data-i18n="ui.server">Сервер:</label>
            <select id="serverId" style="margin-left: 0.4em;">
              <option value="server1">Server 1 (Forge 1.20.1)</option>
              <option value="server2" selected>Server 2 (Arclight 1.21.1)</option>
              <option value="server3">Server 3 (Lite — черепашка)</option>
            </select>
          </div>
          <div style="margin-bottom: 0.5em;">
            <label data-i18n="ui.computerId">Computer ID:</label>
            <input type="number" id="computerId" min="0" value="0" style="width: 5em; margin-left: 0.4em;">
          </div>
          <div>
            <button id="uploadMcButton" data-i18n="ui.upload">📤 Надіслати на Minecraft</button>
          </div>
          <div id="uploadStatus" style="margin-top: 0.5em; min-height: 1.2em;"></div>
          <div style="margin-top: 0.8em; padding-top: 0.6em; border-top: 1px dashed #666;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4em;">
              <strong data-i18n="ui.filesOnServer">Файли на сервері</strong>
              <button id="refreshFilesBtn" data-i18n="ui.refresh">Оновити список</button>
            </div>
            <ul id="fileList"><li class="file-list-empty" data-i18n="ui.noData">(немає даних)</li></ul>
            <div id="fileListStatus" style="margin-top: 0.4em; min-height: 1em; font-size: 0.9em;"></div>
          </div>
        </div>
        <!--<button id="connectButton">Connect to Pastebin</button>
        <button id="uploadButton">Upload to Pastebin</button>
        <button id="uploadWorkspaceButton">Upload Workspace to Pastebin</button>
        <button id="loadWorkspaceButton">Load Workspace from Pastebin</button>-->
      </div>
      <div id="blocklyDiv"></div>
    </div>
  </body>
</html>
