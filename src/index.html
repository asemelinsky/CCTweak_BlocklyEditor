<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ComputerCraft : Blockly Editor</title>
    <link rel="icon" href="favicon.ico">
  </head>
  <body>
    <div id="pageContainer">

      <header id="topBar">
        <div id="topTitle">CCTweak Blockly Editor</div>
        <div id="topActions">
          <label data-i18n="ui.lang">Мова:</label>
          <select id="langSelect">
            <option value="uk">Українська</option>
            <option value="en">English</option>
          </select>
        </div>
      </header>

      <div id="mainRow">
        <aside id="outputPane">

          <section class="panel">
            <h3 data-i18n="ui.sectionFile">📁 Файл</h3>
            <input type="text" name="fileName" id="fileName" value="program" data-i18n-placeholder="ui.fileNamePlaceholder">
            <div class="btn-row">
              <button id="newButton" data-i18n="ui.newFile">➕ Новий</button>
              <button id="loadButton" data-i18n="ui.load">📂 Відкрити</button>
              <button id="downloadButton" data-i18n="ui.download">💾 Зберегти</button>
              <button id="copyButton" data-i18n="ui.copy">📋 Копіювати Lua</button>
            </div>
          </section>

          <section class="panel">
            <h3 data-i18n="ui.sectionDeploy">🎯 Надіслати на сервер</h3>
            <label data-i18n="ui.server">Сервер:</label>
            <select id="serverId">
              <option value="server1">Server 1 (Forge 1.20.1)</option>
              <option value="server2" selected>Server 2 (Arclight 1.21.1)</option>
              <option value="server3">Server 3 (Lite — черепашка)</option>
            </select>
            <label data-i18n="ui.computerId">ID комп'ютера:</label>
            <input type="number" id="computerId" min="0" value="0">
            <button id="uploadMcButton" class="primary" data-i18n="ui.upload">📤 Надіслати на Minecraft</button>
            <div id="uploadStatus"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h3 data-i18n="ui.filesOnServer">📚 Файли на сервері</h3>
              <button id="refreshFilesBtn" data-i18n="ui.refresh">🔄</button>
            </div>
            <ul id="fileList"><li class="file-list-empty" data-i18n="ui.noData">(немає даних)</li></ul>
            <div id="fileListStatus"></div>
          </section>

        </aside>
        <div id="workspaceCol">
          <div id="tabBar">
            <button id="addTabBtn" data-i18n-title="ui.newTabTitle" title="Новий файл (Ctrl+T)">+</button>
          </div>
          <div id="blocklyDiv"></div>
        </div>
      </div>

      <footer id="backpackDock" class="collapsed">
        <div class="backpack-head">
          <span data-i18n="ui.backpack">🎒 Рюкзак</span>
          <button id="backpackToggle" title="Розгорнути/згорнути">▲</button>
        </div>
        <div id="backpackContent">
          <div class="backpack-placeholder" data-i18n="ui.backpackPlaceholder">
            Реалізація у беклозі, пункт #3. Перетягуй сюди групи блоків, щоб копіювати між вкладками.
          </div>
        </div>
      </footer>

    </div>
  </body>
</html>
