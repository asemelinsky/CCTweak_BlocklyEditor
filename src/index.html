<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ComputerCraft : Blockly Editor</title>
    <link rel="icon" href="favicon.ico">
  </head>
  <body>
    <div id="pageContainer">
      <div id="outputPane">
        <pre id="generatedCode" style="min-height: 50%;" class="language-lua"><code></code></pre>
        <input type="text" name="fileName" id="fileName" value="program" style="margin-top: 1.5em;">
        <button id="copyButton">Copy</button>
        <button id="downloadButton">Download</button>
        <button id="downloadLuaButton">Download Lua</button>
        <button id="loadButton">Load</button>
        <div id="mcUploadBar" style="margin-top: 1em; padding: 0.6em; border: 1px solid #444; border-radius: 6px;">
          <label>Сервер:
            <select id="serverId">
              <option value="server1">Server 1 (Forge 1.20.1)</option>
              <option value="server2" selected>Server 2 (Arclight 1.21.1)</option>
            </select>
          </label>
          <label style="margin-left: 0.6em;">Computer ID:
            <input type="number" id="computerId" min="0" value="0" style="width: 5em;">
          </label>
          <button id="uploadMcButton" style="margin-left: 0.6em;">📤 Надіслати на Minecraft</button>
          <span id="uploadStatus" style="margin-left: 0.6em;"></span>
        </div>
        <!--<button id="connectButton">Connect to Pastebin</button>
        <button id="uploadButton">Upload to Pastebin</button>
        <button id="uploadWorkspaceButton">Upload Workspace to Pastebin</button>
        <button id="loadWorkspaceButton">Load Workspace from Pastebin</button>-->
      </div>
      <div id="blocklyDiv"></div>
    </div>
  </body>
</html>
